name: Publish to GHCR
# Verify actual GHCR privacy before publishing download tags.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-private" >> "$GITHUB_OUTPUT"
      - name: Require a private package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          package_url="$GITHUB_API_URL/users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE_NAME##*/}"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$package_url")
          case "$status" in
            200) jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json" ;;
            404) echo 'No accessible package found; newly uploaded digests must pass the privacy check.' ;;
            *) echo "::error::Unable to check GHCR package visibility (HTTP $status)."; exit 1 ;;
          esac
          # A repository token can receive 404 for an existing, unlinked public
          # package. Independently reject packages that allow anonymous pulls.
          anonymous_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$GITHUB_REPOSITORY_OWNER/${IMAGE_NAME##*/}:pull")
          if [[ "$anonymous_status" == 200 ]]; then
            echo '::error::This package permits anonymous pulls; choose an unused private package name.'
            exit 1
          fi
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=sha,format=long
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Reject invalid release tags
        if: github.event_name == 'push'
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "$IMAGE_VERSION" == sha-* ]]; then
            echo '::error::Release tags must use SemVer, for example v0.1.0 or v0.1.0-rc.1.'
            exit 1
          fi

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  build:
    name: Build production image (${{ matrix.arch }})
    needs: [metadata, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.metadata.outputs.labels }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cammon-${{ matrix.arch }}
          cache-to: type=gha,scope=cammon-${{ matrix.arch }},mode=max
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Verify privacy before publishing tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.metadata.outputs.image }}
        run: |
          package_url="$GITHUB_API_URL/users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE_NAME##*/}"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --output "$RUNNER_TEMP/package.json" "$package_url"
          jq '{name, visibility, version_count}' "$RUNNER_TEMP/package.json"
          jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and verify multi-platform manifest
        env:
          IMAGE_NAME: ${{ needs.metadata.outputs.image }}
          IMAGE_TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          mapfile -t image_tags <<< "$IMAGE_TAGS"
          tag_args=()
          for image_tag in "${image_tags[@]}"; do
            tag_args+=(--tag "$image_tag")
          done
          digest_args=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            digest="${digest_file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            digest_args+=("$IMAGE_NAME@sha256:$digest")
          done
          [[ "${#digest_args[@]}" == 2 ]]
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          docker buildx imagetools inspect "${image_tags[0]}" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          printf 'Published image: `%s`\n\n' "$IMAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- `%s`\n' "${image_tags[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify package remains private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.metadata.outputs.image }}
        run: |
          package_url="$GITHUB_API_URL/users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE_NAME##*/}"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --output "$RUNNER_TEMP/package.json" "$package_url"
          jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json"
          jq '{name, visibility, version_count}' "$RUNNER_TEMP/package.json"
          printf '\nPackage visibility: Private\n' >> "$GITHUB_STEP_SUMMARY"
