# NAS deployment using the published image; no source checkout or local build required.
services:
  cammon:
    image: ${CAMMON_IMAGE:-ghcr.io/hsyhhssyy/cammon:latest}
    pull_policy: missing
    # Listen directly on the NAS IP; host networking does not use ports mappings.
    # SMB: TCP 139/445; NetBIOS discovery: UDP 137/138.
    # Management: TCP CAMMON_PORT, default 18080.
    network_mode: host
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      CAMMON_HOST: 0.0.0.0
      CAMMON_PORT: ${CAMMON_PORT:-18080}
      CAMMON_ADMIN_USERNAME: ${CAMMON_ADMIN_USERNAME:-admin}
      CAMMON_ADMIN_PASSWORD: ${CAMMON_ADMIN_PASSWORD:?请设置至少 12 字符的管理员密码}
      CAMMON_POSTGRES_DSN: ${CAMMON_POSTGRES_DSN:?请设置 PostgreSQL 元数据连接}
      CAMMON_SECRET_KEY: ${CAMMON_SECRET_KEY:?请设置稳定的 Fernet 凭据加密密钥}
      CAMMON_POSTGRES_SCHEMA: ${CAMMON_POSTGRES_SCHEMA:-cammon}
      CAMMON_METADATA_SYNC_SECONDS: ${CAMMON_METADATA_SYNC_SECONDS:-5}
      CAMMON_SAMBA_ENABLED: "true"
      CAMMON_ALLOW_NTLMV1: ${CAMMON_ALLOW_NTLMV1:-false}
      CAMMON_SUCCESSOR_QUIET_SECONDS: ${CAMMON_SUCCESSOR_QUIET_SECONDS:-10}
      CAMMON_IDLE_SEAL_SECONDS: ${CAMMON_IDLE_SEAL_SECONDS:-1800}
      CAMMON_CACHE_LIMIT_BYTES: ${CAMMON_CACHE_LIMIT_BYTES:-10737418240}
      CAMMON_CACHE_RESERVE_BYTES: ${CAMMON_CACHE_RESERVE_BYTES:-67108864}
      CAMMON_FFMPEG_THREADS: ${CAMMON_FFMPEG_THREADS:-2}
      # Metadata stays in process memory; only video bytes use temporary disk space.
      CAMMON_DATA_DIR: /run/cammon/runtime
      CAMMON_CACHE_DIR: /cache
    tmpfs:
      - /run/cammon:mode=0755
    # /cache uses the container's writable layer. No persistent data volume is required.
    # The production image provides its own /healthz healthcheck.
